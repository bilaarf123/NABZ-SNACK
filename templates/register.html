{% extends 'base.html' %}

{% block title %}Daftar Akun - NABZ SNACK{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="card-premium p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="fs-1 text-success"><i class="fas fa-user-plus"></i></span>
                    <h2 class="text-dark fw-bold mt-2">Daftar Akun Baru</h2>
                    <p class="text-muted">Buat akun untuk bertransaksi atau mengelola toko</p>
                </div>
                
                <form action="{{ url_for('register') }}" method="POST" onsubmit="return validateRegisterForm()" id="register-form">
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted fw-semibold small">Nama Pengguna (Username)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-secondary border-opacity-25 text-muted"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" id="username" class="form-control bg-white text-dark border-secondary border-opacity-25" placeholder="username123" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted fw-semibold small">Alamat Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-secondary border-opacity-25 text-muted"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" id="email" class="form-control bg-white text-dark border-secondary border-opacity-25" placeholder="nama@email.com" required>
                        </div>
                    </div>
                    
                    <!-- Role is automatically set to customer in backend -->
                    
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted fw-semibold small">Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-secondary border-opacity-25 text-muted"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" id="password" class="form-control bg-white text-dark border-secondary border-opacity-25" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label text-muted fw-semibold small">Konfirmasi Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-secondary border-opacity-25 text-muted"><i class="fas fa-check-double"></i></span>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control bg-white text-dark border-secondary border-opacity-25" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-fire w-100 py-2 mb-3" id="register-submit-btn">Daftar Akun Baru</button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Sudah memiliki akun? <a href="{{ url_for('login') }}" class="text-success fw-bold">Masuk Di Sini</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function validateRegisterForm() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (password !== confirmPassword) {
            showToast('Kata sandi dan konfirmasi kata sandi tidak cocok!', 'error');
            return false;
        }
        return true;
    }
</script>
{% endblock %}
